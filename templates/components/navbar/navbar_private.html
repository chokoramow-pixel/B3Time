{% load static %}
<nav class="navbar bg-white shadow-sm">
    <div class="container-fluid px-3 px-lg-4 d-flex flex-wrap align-items-center justify-content-between gap-2 py-2">

        <a class="navbar-brand mb-0" href="{% url 'usuarios:dashboard' %}">
            <img src="{% static 'img/logo.png' %}" alt="Be Time" height="67">
        </a>

        <div class="d-flex align-items-center gap-2 flex-wrap">

            <span class="normal text-nowrap">
                <span class="fw-semibold">{{ request.user.nombres }}</span>
                <span class="badge text-bg-light border ms-1">
                    {% if request.user.administrador %}
                        Administrador
                    {% elif request.user.personal_bienestar %}
                        Bienestar
                    {% elif request.user.aprendiz %}
                        Aprendiz
                    {% endif %}
                </span>
            </span>

            <a href="{% url 'usuarios:logout' %}" class="btn btn-outline-success btn-sm">
                Cerrar sesión
            </a>

        </div>

    </div>
</nav>
